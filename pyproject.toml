[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrframe"
version = "0.1.0"
description = "Convert a geographic bounding box into a 3D-printable STL terrain model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyle RessLiere" }]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "requests>=2.31",
    "scipy>=1.11",
    "pyproj>=3.6",
    "trimesh>=4.0",
    # trimesh's 3MF exporter is a lazy import; without these, `-o out.3mf`
    # fails at write time rather than at install time.
    "networkx>=3.0",
    "lxml>=4.9",
    # OSM feature stamping: vector geometry plus rasterisation onto the grid.
    # rasterio is used for local rasterize/decode only -- never /vsicurl, which
    # deadlocks at process exit on Windows.
    "shapely>=2.0",
    "rasterio>=1.3",
    # Windows ships no tz database, so zoneinfo needs this to stamp run
    # folders with a real Eastern abbreviation (EST vs EDT).
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
terrframe = "terrframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires live network access (deselect with '-m \"not network\"')",
]
